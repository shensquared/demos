<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Descent Training</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #fafafa; color: #2b2b2b;
      }

      .container { display: flex; height: 100%; }

      /* Sizes are deck pixels. The deck places this at 1100x560, so one CSS px is one
         slide px, and ROOM.md sets the floors: 20 for anything (A1) and 29 for what the
         room must read (A2), which here is the iteration count and J. The sidebar
         widened from 240 to hold the 20px legend rows without wrapping. */
      .sidebar {
        width: 300px; min-width: 300px;
        padding: 20px 22px;
        background: #fff;
        border-right: 1px solid #e0e0e0;
        display: flex; flex-direction: column;
        gap: 16px;
      }

      /* Embed mode: the slide carries its own title and a caption naming gradient
         descent on the NLL, so the heading goes and the padding tightens (B4). The
         definition of J stays, since the slide does not state it. */
      body.embed .sidebar { padding: 16px 20px; }
      body.embed .sidebar h1 { display: none; }

      .sidebar h1 { font-size: 24px; font-weight: 600; }
      .sidebar .eq { font-size: 20px; color: #5f6672; margin-top: 4px; }

      .control-group label {
        display: block; font-size: 20px; font-weight: 500;
        margin-bottom: 8px;
      }

      .control-group .val {
        font-family: "SF Mono", Menlo, monospace;
        font-size: 20px; float: right;
      }

      input[type="range"] {
        -webkit-appearance: none; width: 100%; height: 6px;
        border-radius: 3px; background: #e0e0e0; outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 16px; height: 16px;
        border-radius: 50%; background: #555; cursor: pointer;
        border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2);
      }

      input[type="range"]:focus-visible { outline: 2px solid #2b2b2b; outline-offset: 6px; }

      .btn-row { display: flex; gap: 8px; }

      .toggle-btn {
        flex: 1; padding: 9px 0;
        font-size: 20px; font-family: inherit;
        border: 1px solid #ddd; border-radius: 4px;
        background: #fff; color: #555; cursor: pointer;
        transition: background .15s, color .15s;
      }

      .toggle-btn:active { transform: translateY(1px); }
      .toggle-btn:focus-visible { outline: 2px solid #2b2b2b; outline-offset: 2px; }
      .toggle-btn.active { background: #555; color: #fff; border-color: #555; }
      @media (prefers-reduced-motion: reduce) { .toggle-btn { transition: none; } }

      /* Swatches match the marks they key: dots near the 20px data markers, the line
         at the separator's 4px (A4). */
      .legend { font-size: 20px; line-height: 1.5; }
      .legend .pair { display: flex; gap: 24px; }

      .legend .dot {
        display: inline-block; width: 16px; height: 16px;
        border-radius: 50%; margin-right: 8px; vertical-align: -1px;
      }

      .legend .arrow {
        display: inline-block; color: #2ecc71;
        font-size: 24px; line-height: 1; margin-right: 6px;
      }

      .legend .line {
        display: inline-block; width: 24px; height: 4px;
        margin-right: 8px; vertical-align: middle;
      }

      /* Was 14px #aaa on white, about 2.3:1 and under the 20px floor. Iteration and J
         are what the room watches during a run, so they take the read-this size; θ and
         accuracy are there to glance at and sit at the floor. */
      .readout {
        margin-top: auto; padding-top: 14px;
        border-top: 1px solid #e0e0e0;
        display: flex; flex-direction: column;
        gap: 10px;
      }

      .readout .row { display: grid; gap: 12px; }
      .readout .row.two { grid-template-columns: 1fr 1fr; }
      .readout .row.three { grid-template-columns: 1fr 1fr 1fr; }

      .readout .name { font-size: 20px; color: #5f6672; }

      .readout .num {
        font-family: "SF Mono", Menlo, monospace;
        font-size: 32px; line-height: 1.15;
      }

      .readout .val {
        font-family: "SF Mono", Menlo, monospace;
        font-size: 20px;
      }

      .readout .acc { font-size: 20px; color: #5f6672; }
      .readout .acc span { font-family: "SF Mono", Menlo, monospace; color: #2b2b2b; }

      .plots { flex: 1; display: flex; height: 100%; min-width: 0; }
      .plots > div { flex: 1; height: 100%; min-width: 0; min-height: 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div>
          <h1>Gradient descent</h1>
          <div class="eq">J(θ, θ₀) = mean NLL</div>
        </div>

        <div class="btn-row">
          <button class="toggle-btn" id="btnRun">Run</button>
          <button class="toggle-btn" id="btnStep">Step</button>
          <button class="toggle-btn" id="btnReset">Reset</button>
        </div>

        <div class="control-group">
          <label for="lr">Learning rate η <span class="val" id="lrVal">0.30</span></label>
          <input type="range" id="lr" min="-2" max="0.69897" value="-0.5229" step="0.001" />
        </div>

        <div class="legend">
          <div class="pair">
            <div><span class="dot" style="background:#e74c3c"></span>y = 1</div>
            <div><span class="dot" style="background:#3a7ebf"></span>y = 0</div>
          </div>
          <div><span class="line" style="background:#333"></span>Separator</div>
          <div><span class="arrow">→</span>θ, toward y = 1</div>
        </div>

        <div class="readout">
          <div class="row two">
            <div><div class="name">Iteration</div><div class="num" id="infoIter">0</div></div>
            <div><div class="name">J</div><div class="num" id="infoJ"></div></div>
          </div>
          <div class="row three">
            <div><div class="name">θ₁</div><div class="val" id="infoT1"></div></div>
            <div><div class="name">θ₂</div><div class="val" id="infoT2"></div></div>
            <div><div class="name">θ₀</div><div class="val" id="infoT0"></div></div>
          </div>
          <div class="acc">Accuracy <span id="infoAcc"></span></div>
        </div>
      </div>

      <div class="plots">
        <div id="plotData"></div>
        <div id="plotLoss"></div>
      </div>
    </div>

    <script>
      // The lecture's running 10-point dataset (same as the separator demo).
      const pts = [
        { x1: -0.8, x2:  1.2, y:  1 },
        { x1: -0.3, x2:  0.9, y:  1 },
        { x1:  0.5, x2:  1.4, y:  1 },
        { x1: -1.0, x2:  0.4, y:  1 },
        { x1:  0.2, x2:  0.7, y:  1 },
        { x1:  1.0, x2: -0.8, y:  0 },
        { x1:  0.5, x2: -1.1, y:  0 },
        { x1: -0.4, x2: -1.2, y:  0 },
        { x1:  1.3, x2: -0.3, y:  0 },
        { x1: -0.1, x2: -0.6, y:  0 },
      ];

      const posCol = '#e74c3c', negCol = '#3a7ebf';
      const cfg = { displayModeBar: false, responsive: true };

      // A2 for axis titles and A3 for ticks, in deck pixels. Marks follow A4: the data
      // points and the current J at 20, plot lines at 4. A nested title.font replaces
      // titlefont whole, size and all, so an axis that recolours its title restates
      // titlefont rather than nesting a font. Hover is off because the readout already
      // carries every number it showed (B9).
      const INK = '#2b2b2b', TICK_COLOR = '#5f6672';
      const AXIS_TITLE = 24, TICK = 20, MARK = 20, LINE = 4;
      const axis = {
        titlefont: { size: AXIS_TITLE, color: INK },
        tickfont: { size: TICK, color: TICK_COLOR },
        zeroline: false, gridcolor: '#e2e2e2', fixedrange: true,
      };
      const baseLayout = {
        font: { family: '"Helvetica Neue", Helvetica, Arial, sans-serif', color: INK },
        paper_bgcolor: '#fafafa', plot_bgcolor: '#fafafa',
        showlegend: false, hovermode: false,
      };

      // Fixed bad init: θ points the wrong way, all 10 points misclassified.
      const INIT = { t1: 1.0, t2: -1.0, t0: -0.3 };

      let t1 = INIT.t1, t2 = INIT.t2, t0 = INIT.t0;
      let iter = 0;
      let lossHist = [];
      let running = false;
      let timer = null;

      const lrEl = document.getElementById('lr');
      const btnRun = document.getElementById('btnRun');

      function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
      function score(x1, x2) { return t1 * x1 + t2 * x2 + t0; }

      function lossOf() {
        let J = 0;
        pts.forEach(p => {
          const g = sigmoid(score(p.x1, p.x2));
          J += p.y === 1 ? -Math.log(Math.max(g, 1e-15)) : -Math.log(Math.max(1 - g, 1e-15));
        });
        return J / pts.length;
      }

      // The J axis is pinned to the starting loss with a little headroom, so the curve
      // descends through a fixed frame instead of the frame rescaling under it, and a
      // run that climbs past the start leaves the top edge visibly (B11). Read at
      // load, while θ still holds INIT. The floor sits just under 0 so the y tick 0
      // clears the x tick 0 at the corner.
      const J0 = lossOf();
      const J_RANGE = [-0.06 * J0, 1.12 * J0];

      // Batch gradient of the mean NLL:
      //   dJ/dθ  = (1/n) Σ (g_i − y_i) x_i
      //   dJ/dθ₀ = (1/n) Σ (g_i − y_i)
      function gradient() {
        let g1 = 0, g2 = 0, g0 = 0;
        pts.forEach(p => {
          const d = sigmoid(score(p.x1, p.x2)) - p.y;
          g1 += d * p.x1; g2 += d * p.x2; g0 += d;
        });
        const n = pts.length;
        return { g1: g1 / n, g2: g2 / n, g0: g0 / n };
      }

      function eta() { return Math.pow(10, parseFloat(lrEl.value)); }

      function stepOnce() {
        const { g1, g2, g0 } = gradient();
        const e = eta();
        t1 -= e * g1; t2 -= e * g2; t0 -= e * g0;
        iter++;
        lossHist.push(lossOf());
      }

      function accuracy() {
        let ok = 0;
        pts.forEach(p => {
          const s = score(p.x1, p.x2);
          if ((p.y === 1) === (s > 0)) ok++;
        });
        return ok;
      }

      function boundaryPts() {
        let bx = [], by = [];
        if (Math.abs(t2) > 0.01) {
          bx = Array.from({ length: 100 }, (_, i) => -EXT + 2 * EXT * i / 99);
          by = bx.map(x => (-t0 - t1 * x) / t2);
        } else if (Math.abs(t1) > 0.01) {
          by = Array.from({ length: 100 }, (_, i) => -EXT + 2 * EXT * i / 99);
          bx = by.map(() => -t0 / t1);
        }
        return { bx, by };
      }

      // The view runs a quarter past ±2 so the corner tick labels, -2 on each axis, do
      // not collide once the plot area is squared up below.
      const EXT = 2.25;
      const NG = 61;
      const gAxis = Array.from({ length: NG }, (_, i) => -EXT + 2 * EXT * i / (NG - 1));

      function drawData() {
        // Faint probability shading: blue where g ≈ 0, red where g ≈ 1.
        const probGrid = gAxis.map(y => gAxis.map(x => sigmoid(score(x, y))));
        const region = {
          x: gAxis, y: gAxis, z: probGrid,
          type: 'heatmap',
          colorscale: [
            [0, 'rgba(58,126,191,.18)'],
            [0.5, 'rgba(250,250,250,0)'],
            [1, 'rgba(231,76,60,.18)'],
          ],
          zmin: 0, zmax: 1,
          showscale: false,
        };

        const { bx, by } = boundaryPts();
        const sep = {
          x: bx, y: by,
          type: 'scatter', mode: 'lines',
          line: { color: '#333', width: LINE },
        };

        const pos = pts.filter(p => p.y === 1);
        const neg = pts.filter(p => p.y === 0);

        const posT = {
          x: pos.map(p => p.x1), y: pos.map(p => p.x2),
          type: 'scatter', mode: 'markers',
          marker: { size: MARK, color: posCol, line: { color: '#fff', width: 2 } },
        };
        const negT = {
          x: neg.map(p => p.x1), y: neg.map(p => p.x2),
          type: 'scatter', mode: 'markers',
          marker: { size: MARK, color: negCol, line: { color: '#fff', width: 2 } },
        };

        // Unit-length arrow for the direction of θ (its magnitude grows
        // during training, so we show direction only).
        const nrm = Math.hypot(t1, t2);
        const hasVec = nrm > 0.01;
        const ax1 = hasVec ? 0.9 * t1 / nrm : 0;
        const ax2 = hasVec ? 0.9 * t2 / nrm : 0;

        // constrain 'domain' keeps both ranges fixed and shrinks the plot area to
        // a square instead. Left at the default, scaleanchor stretches the y range to
        // fill the tall pane and the shading floats in a band with bare axis above and
        // below it.
        const layout = {
          ...baseLayout,
          xaxis: { ...axis, title: { text: 'x<sub>1</sub>' }, range: [-EXT, EXT], dtick: 1, constrain: 'domain' },
          yaxis: { ...axis, title: { text: 'x<sub>2</sub>' }, range: [-EXT, EXT], dtick: 1, constrain: 'domain', scaleanchor: 'x' },
          margin: { l: 64, r: 16, t: 16, b: 84 },
          annotations: hasVec ? [{
            x: ax1, y: ax2,
            ax: 0, ay: 0,
            xref: 'x', yref: 'y', axref: 'x', ayref: 'y',
            showarrow: true,
            arrowhead: 2, arrowsize: 1, arrowwidth: LINE,
            arrowcolor: '#2ecc71', text: '',
          }] : [],
        };

        Plotly.react('plotData', [region, sep, posT, negT], layout, cfg);
      }

      function drawLoss() {
        // Subsample long histories so redraws stay fast.
        let xs = [], ys = [];
        const n = lossHist.length;
        const stride = Math.max(1, Math.ceil(n / 2000));
        for (let i = 0; i < n; i += stride) { xs.push(i); ys.push(lossHist[i]); }
        if (xs[xs.length - 1] !== n - 1) { xs.push(n - 1); ys.push(lossHist[n - 1]); }

        const curve = {
          x: xs, y: ys,
          type: 'scatter', mode: 'lines',
          line: { color: '#555', width: LINE },
        };

        // cliponaxis off so the current point stays whole at the edges of the frame.
        const marker = {
          x: [iter], y: [lossHist[n - 1]],
          type: 'scatter', mode: 'markers', cliponaxis: false,
          marker: { size: MARK, color: '#f1c40f', line: { color: '#fff', width: 2 } },
        };

        const layout = {
          ...baseLayout,
          xaxis: { ...axis, title: { text: 'iteration' }, range: [-2, Math.max(60, iter * 1.05)], nticks: 5 },
          yaxis: { ...axis, title: { text: 'J (mean NLL)' }, range: J_RANGE, dtick: 0.5 },
          margin: { l: 80, r: 24, t: 16, b: 92 },
        };

        Plotly.react('plotLoss', [curve, marker], layout, cfg);
      }

      function updateReadouts() {
        document.getElementById('lrVal').textContent = eta().toPrecision(2);
        document.getElementById('infoIter').textContent = iter;
        document.getElementById('infoJ').textContent = lossHist[lossHist.length - 1].toFixed(4);
        document.getElementById('infoT1').textContent = t1.toFixed(2);
        document.getElementById('infoT2').textContent = t2.toFixed(2);
        document.getElementById('infoT0').textContent = t0.toFixed(2);
        document.getElementById('infoAcc').textContent = accuracy() * 10 + '%';
      }

      function draw() {
        updateReadouts();
        drawData();
        drawLoss();
      }

      function setRunning(on) {
        running = on;
        btnRun.textContent = on ? 'Pause' : 'Run';
        btnRun.classList.toggle('active', on);
        if (on) {
          timer = setInterval(() => {
            stepOnce();
            if (!isFinite(lossHist[lossHist.length - 1])) setRunning(false);
            draw();
          }, 40);
        } else if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function reset() {
        setRunning(false);
        t1 = INIT.t1; t2 = INIT.t2; t0 = INIT.t0;
        iter = 0;
        lossHist = [lossOf()];
        draw();
      }

      btnRun.addEventListener('click', () => setRunning(!running));
      document.getElementById('btnStep').addEventListener('click', () => {
        setRunning(false);
        stepOnce();
        draw();
      });
      document.getElementById('btnReset').addEventListener('click', reset);
      lrEl.addEventListener('input', () => {
        document.getElementById('lrVal').textContent = eta().toPrecision(2);
      });

      // Optional URL params (handy for embedding and screenshots):
      //   ?embed       drop the heading the slide already supplies (B4)
      //   ?eta=0.5     set the learning rate
      //   ?iters=300   pre-run this many iterations at load
      const q = new URLSearchParams(location.search);
      if (q.has('embed')) document.body.classList.add('embed');
      if (q.has('eta')) lrEl.value = Math.log10(parseFloat(q.get('eta')));
      lossHist = [lossOf()];
      const pre = parseInt(q.get('iters') || '0', 10);
      for (let i = 0; i < pre; i++) stepOnce();
      draw();

      const plotEls = [document.getElementById('plotData'), document.getElementById('plotLoss')];
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => plotEls.forEach((el) => Plotly.Plots.resize(el)));
        plotEls.forEach((el) => ro.observe(el));
      } else {
        window.addEventListener('resize', () => plotEls.forEach((el) => Plotly.Plots.resize(el)));
      }
    </script>
  </body>
</html>
