<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Descent Training</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #fafafa; color: #333;
      }

      .container { display: flex; height: 100%; }

      .sidebar {
        width: 240px; min-width: 240px;
        padding: 24px 20px;
        background: #fff;
        border-right: 1px solid #e0e0e0;
        display: flex; flex-direction: column;
        gap: 18px;
        overflow-y: auto;
      }

      .sidebar h1 { font-size: 20px; font-weight: 600; color: #222; }
      .sidebar .eq { font-size: 14px; color: #888; margin-top: 2px; }

      .control-group label {
        display: block; font-size: 15px; font-weight: 500;
        color: #555; margin-bottom: 6px;
      }

      .control-group .val {
        font-family: "SF Mono", Menlo, monospace;
        font-size: 15px; color: #222; float: right;
      }

      input[type="range"] {
        -webkit-appearance: none; width: 100%; height: 6px;
        border-radius: 3px; background: #e0e0e0; outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 16px; height: 16px;
        border-radius: 50%; background: #555; cursor: pointer;
        border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2);
      }

      .btn-row { display: flex; gap: 8px; }

      .toggle-btn {
        flex: 1; padding: 8px 0;
        font-size: 14px; font-family: inherit;
        border: 1px solid #ddd; border-radius: 4px;
        background: #fff; color: #777; cursor: pointer;
        transition: all .15s;
      }

      .toggle-btn.active { background: #555; color: #fff; border-color: #555; }

      .legend { font-size: 14px; color: #666; line-height: 2.2; }

      .legend .dot {
        display: inline-block; width: 9px; height: 9px;
        border-radius: 50%; margin-right: 6px; vertical-align: middle;
      }

      .legend .arrow {
        display: inline-block; color: #2ecc71;
        font-size: 18px; margin-right: 4px; vertical-align: middle;
      }

      .legend .line {
        display: inline-block; width: 16px; height: 2px;
        margin-right: 6px; vertical-align: middle;
      }

      .info {
        margin-top: auto; padding-top: 14px;
        border-top: 1px solid #e0e0e0;
        font-size: 14px; color: #aaa; line-height: 1.8;
      }

      .info span {
        font-family: "SF Mono", Menlo, monospace; font-size: 14px; color: #666;
      }

      .plots { flex: 1; display: flex; height: 100%; min-width: 0; }
      .plots > div { flex: 1; height: 100%; min-width: 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div>
          <h1>Gradient Descent</h1>
          <div class="eq">J(θ, θ₀) = mean NLL</div>
        </div>

        <div class="btn-row">
          <button class="toggle-btn" id="btnRun">Run</button>
          <button class="toggle-btn" id="btnStep">Step</button>
          <button class="toggle-btn" id="btnReset">Reset</button>
        </div>

        <div class="control-group">
          <label>Learning rate η <span class="val" id="lrVal">0.30</span></label>
          <input type="range" id="lr" min="-2" max="0.69897" value="-0.5229" step="0.001" />
        </div>

        <div class="legend">
          <div><span class="dot" style="background:#e74c3c"></span>Positive (+1)</div>
          <div><span class="dot" style="background:#3a7ebf"></span>Negative (0)</div>
          <div><span class="line" style="background:#333"></span>Separator</div>
          <div><span class="arrow">→</span>θ direction (positive side)</div>
        </div>

        <div class="info">
          Iteration: <span id="infoIter">0</span><br>
          J: <span id="infoJ">–</span><br>
          θ₁: <span id="infoT1">–</span>&nbsp;
          θ₂: <span id="infoT2">–</span><br>
          θ₀: <span id="infoT0">–</span><br>
          Accuracy: <span id="infoAcc">–</span>
        </div>
      </div>

      <div class="plots">
        <div id="plotData"></div>
        <div id="plotLoss"></div>
      </div>
    </div>

    <script>
      // The lecture's running 10-point dataset (same as the separator demo).
      const pts = [
        { x1: -0.8, x2:  1.2, y:  1 },
        { x1: -0.3, x2:  0.9, y:  1 },
        { x1:  0.5, x2:  1.4, y:  1 },
        { x1: -1.0, x2:  0.4, y:  1 },
        { x1:  0.2, x2:  0.7, y:  1 },
        { x1:  1.0, x2: -0.8, y:  0 },
        { x1:  0.5, x2: -1.1, y:  0 },
        { x1: -0.4, x2: -1.2, y:  0 },
        { x1:  1.3, x2: -0.3, y:  0 },
        { x1: -0.1, x2: -0.6, y:  0 },
      ];

      const posCol = '#e74c3c', negCol = '#3a7ebf';
      const cfg = { displayModeBar: false, responsive: true };

      // Fixed bad init: θ points the wrong way, all 10 points misclassified.
      const INIT = { t1: 1.0, t2: -1.0, t0: -0.3 };

      let t1 = INIT.t1, t2 = INIT.t2, t0 = INIT.t0;
      let iter = 0;
      let lossHist = [];
      let running = false;
      let timer = null;

      const lrEl = document.getElementById('lr');
      const btnRun = document.getElementById('btnRun');

      function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
      function score(x1, x2) { return t1 * x1 + t2 * x2 + t0; }

      function lossOf() {
        let J = 0;
        pts.forEach(p => {
          const g = sigmoid(score(p.x1, p.x2));
          J += p.y === 1 ? -Math.log(Math.max(g, 1e-15)) : -Math.log(Math.max(1 - g, 1e-15));
        });
        return J / pts.length;
      }

      // Batch gradient of the mean NLL:
      //   dJ/dθ  = (1/n) Σ (g_i − y_i) x_i
      //   dJ/dθ₀ = (1/n) Σ (g_i − y_i)
      function gradient() {
        let g1 = 0, g2 = 0, g0 = 0;
        pts.forEach(p => {
          const d = sigmoid(score(p.x1, p.x2)) - p.y;
          g1 += d * p.x1; g2 += d * p.x2; g0 += d;
        });
        const n = pts.length;
        return { g1: g1 / n, g2: g2 / n, g0: g0 / n };
      }

      function eta() { return Math.pow(10, parseFloat(lrEl.value)); }

      function stepOnce() {
        const { g1, g2, g0 } = gradient();
        const e = eta();
        t1 -= e * g1; t2 -= e * g2; t0 -= e * g0;
        iter++;
        lossHist.push(lossOf());
      }

      function accuracy() {
        let ok = 0;
        pts.forEach(p => {
          const s = score(p.x1, p.x2);
          if ((p.y === 1) === (s > 0)) ok++;
        });
        return ok;
      }

      function boundaryPts() {
        let bx = [], by = [];
        if (Math.abs(t2) > 0.01) {
          bx = Array.from({ length: 100 }, (_, i) => -2 + 4 * i / 99);
          by = bx.map(x => (-t0 - t1 * x) / t2);
        } else if (Math.abs(t1) > 0.01) {
          by = Array.from({ length: 100 }, (_, i) => -2 + 4 * i / 99);
          bx = by.map(() => -t0 / t1);
        }
        return { bx, by };
      }

      const NG = 61;
      const gAxis = Array.from({ length: NG }, (_, i) => -2 + 4 * i / (NG - 1));

      function drawData() {
        // Faint probability shading: blue where g ≈ 0, red where g ≈ 1.
        const probGrid = gAxis.map(y => gAxis.map(x => sigmoid(score(x, y))));
        const region = {
          x: gAxis, y: gAxis, z: probGrid,
          type: 'heatmap',
          colorscale: [
            [0, 'rgba(58,126,191,.18)'],
            [0.5, 'rgba(250,250,250,0)'],
            [1, 'rgba(231,76,60,.18)'],
          ],
          zmin: 0, zmax: 1,
          showscale: false, hoverinfo: 'skip',
        };

        const { bx, by } = boundaryPts();
        const sep = {
          x: bx, y: by,
          type: 'scatter', mode: 'lines',
          line: { color: '#333', width: 2 },
          hoverinfo: 'skip',
        };

        const pos = pts.filter(p => p.y === 1);
        const neg = pts.filter(p => p.y === 0);

        const posT = {
          x: pos.map(p => p.x1), y: pos.map(p => p.x2),
          type: 'scatter', mode: 'markers',
          marker: { size: 9, color: posCol, line: { color: '#fff', width: 1.5 } },
          hovertemplate: '(%{x:.1f}, %{y:.1f})<extra>+1</extra>',
        };
        const negT = {
          x: neg.map(p => p.x1), y: neg.map(p => p.x2),
          type: 'scatter', mode: 'markers',
          marker: { size: 9, color: negCol, line: { color: '#fff', width: 1.5 } },
          hovertemplate: '(%{x:.1f}, %{y:.1f})<extra>0</extra>',
        };

        // Unit-length arrow for the direction of θ (its magnitude grows
        // during training, so we show direction only).
        const nrm = Math.hypot(t1, t2);
        const hasVec = nrm > 0.01;
        const ax1 = hasVec ? 0.9 * t1 / nrm : 0;
        const ax2 = hasVec ? 0.9 * t2 / nrm : 0;

        const layout = {
          xaxis: {
            title: { text: 'x₁', font: { size: 14 } },
            range: [-2, 2], zeroline: false, gridcolor: '#eee',
          },
          yaxis: {
            title: { text: 'x₂', font: { size: 14 } },
            range: [-2, 2], zeroline: false, gridcolor: '#eee',
            scaleanchor: 'x',
          },
          margin: { l: 48, r: 16, t: 16, b: 44 },
          paper_bgcolor: '#fafafa', plot_bgcolor: '#fafafa',
          showlegend: false, hovermode: 'closest',
          annotations: hasVec ? [{
            x: ax1, y: ax2,
            ax: 0, ay: 0,
            xref: 'x', yref: 'y', axref: 'x', ayref: 'y',
            showarrow: true,
            arrowhead: 2, arrowsize: 1.5, arrowwidth: 2,
            arrowcolor: '#2ecc71', text: '',
          }] : [],
        };

        Plotly.react('plotData', [region, sep, posT, negT], layout, cfg);
      }

      function drawLoss() {
        // Subsample long histories so redraws stay fast.
        let xs = [], ys = [];
        const n = lossHist.length;
        const stride = Math.max(1, Math.ceil(n / 2000));
        for (let i = 0; i < n; i += stride) { xs.push(i); ys.push(lossHist[i]); }
        if (xs[xs.length - 1] !== n - 1) { xs.push(n - 1); ys.push(lossHist[n - 1]); }

        const curve = {
          x: xs, y: ys,
          type: 'scatter', mode: 'lines',
          line: { color: '#555', width: 2 },
          hovertemplate: 'iter %{x}<br>J=%{y:.4f}<extra></extra>',
        };

        const marker = {
          x: [iter], y: [lossHist[n - 1]],
          type: 'scatter', mode: 'markers',
          marker: { size: 11, color: '#f1c40f', line: { color: '#fff', width: 1.5 } },
          hovertemplate: 'iter %{x}<br>J=%{y:.4f}<extra></extra>',
        };

        const layout = {
          xaxis: {
            title: { text: 'iteration', font: { size: 14 } },
            range: [-2, Math.max(60, iter * 1.05)],
            zeroline: false, gridcolor: '#eee',
          },
          yaxis: {
            title: { text: 'J (mean NLL)', font: { size: 14 } },
            rangemode: 'tozero', zeroline: false, gridcolor: '#eee',
          },
          margin: { l: 52, r: 16, t: 16, b: 44 },
          paper_bgcolor: '#fafafa', plot_bgcolor: '#fafafa',
          showlegend: false, hovermode: 'closest',
        };

        Plotly.react('plotLoss', [curve, marker], layout, cfg);
      }

      function updateReadouts() {
        document.getElementById('lrVal').textContent = eta().toPrecision(2);
        document.getElementById('infoIter').textContent = iter;
        document.getElementById('infoJ').textContent = lossHist[lossHist.length - 1].toFixed(4);
        document.getElementById('infoT1').textContent = t1.toFixed(2);
        document.getElementById('infoT2').textContent = t2.toFixed(2);
        document.getElementById('infoT0').textContent = t0.toFixed(2);
        document.getElementById('infoAcc').textContent = accuracy() * 10 + '%';
      }

      function draw() {
        updateReadouts();
        drawData();
        drawLoss();
      }

      function setRunning(on) {
        running = on;
        btnRun.textContent = on ? 'Pause' : 'Run';
        btnRun.classList.toggle('active', on);
        if (on) {
          timer = setInterval(() => {
            stepOnce();
            if (!isFinite(lossHist[lossHist.length - 1])) setRunning(false);
            draw();
          }, 40);
        } else if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function reset() {
        setRunning(false);
        t1 = INIT.t1; t2 = INIT.t2; t0 = INIT.t0;
        iter = 0;
        lossHist = [lossOf()];
        draw();
      }

      btnRun.addEventListener('click', () => setRunning(!running));
      document.getElementById('btnStep').addEventListener('click', () => {
        setRunning(false);
        stepOnce();
        draw();
      });
      document.getElementById('btnReset').addEventListener('click', reset);
      lrEl.addEventListener('input', () => {
        document.getElementById('lrVal').textContent = eta().toPrecision(2);
      });

      // Optional URL params (handy for embedding and screenshots):
      //   ?eta=0.5     set the learning rate
      //   ?iters=300   pre-run this many iterations at load
      const q = new URLSearchParams(location.search);
      if (q.has('eta')) lrEl.value = Math.log10(parseFloat(q.get('eta')));
      lossHist = [lossOf()];
      const pre = parseInt(q.get('iters') || '0', 10);
      for (let i = 0; i < pre; i++) stepOnce();
      draw();

      window.addEventListener('resize', () => {
        Plotly.Plots.resize(document.getElementById('plotData'));
        Plotly.Plots.resize(document.getElementById('plotLoss'));
      });
    </script>
  </body>
</html>
