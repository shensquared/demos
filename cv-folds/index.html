<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Fold Cross-Validation</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #fafafa; color: #333;
        overflow: hidden;
      }

      .app {
        display: flex; flex-direction: column;
        height: 100%;
        padding: 10px 14px 30px;
        gap: 8px;
      }

      .topbar { display: flex; align-items: center; gap: 14px; }

      .topbar h1 {
        font-size: 18px; font-weight: 600; color: #222;
        white-space: nowrap;
      }

      .status {
        flex: 1; min-width: 0;
        font-size: 13px; color: #555;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .controls { display: flex; gap: 8px; }

      .btn {
        padding: 7px 14px;
        font-size: 13px; font-family: inherit;
        border: 1px solid #ddd; border-radius: 4px;
        background: #fff; color: #666;
        cursor: pointer; transition: all .15s;
        white-space: nowrap;
      }

      .btn:hover { background: #f0f0f0; }

      .btn.primary { background: #555; color: #fff; border-color: #555; }
      .btn.primary:hover { background: #333; }

      .midbar { display: flex; align-items: center; gap: 12px; }

      .bar-label { font-size: 13px; font-weight: 500; color: #555; white-space: nowrap; }

      .lam-group {
        display: flex; gap: 0;
        border: 1px solid #ddd; border-radius: 4px;
        overflow: hidden;
      }

      .lam-group button {
        padding: 6px 11px;
        font-size: 13px; font-family: "SF Mono", Menlo, monospace;
        border: none; background: #fff; color: #777;
        cursor: pointer; transition: all .15s;
      }

      .lam-group button.active { background: #555; color: #fff; }
      .lam-group button:not(:last-child) { border-right: 1px solid #ddd; }

      .fold-strip { display: flex; gap: 6px; flex: 1; min-width: 0; }

      .chunk {
        flex: 1; text-align: center;
        font-size: 12px; padding: 6px 0;
        border-radius: 4px;
        background: #e8e8e8; color: #777;
        border-bottom: 3px solid transparent;
        transition: all .15s;
        white-space: nowrap;
      }

      .chunk.val { background: #2ecc71; color: #fff; font-weight: 600; }
      .chunk.scored { border-bottom-color: #f1c40f; }

      .legend { font-size: 12px; color: #666; white-space: nowrap; }

      .legend .dot {
        display: inline-block; width: 9px; height: 9px;
        border-radius: 50%; margin: 0 5px 0 10px; vertical-align: middle;
      }

      .legend .line {
        display: inline-block; width: 16px; height: 3px;
        margin: 0 5px 0 10px; vertical-align: middle;
      }

      .plots { flex: 1; display: flex; min-height: 0; }
      #plotFit { flex: 1.35; min-width: 0; }
      #plotBars { flex: 0.75; min-width: 0; }
      #plotAvg { flex: 1.1; min-width: 0; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>K-Fold Cross-Validation</h1>
        <div class="status" id="status"></div>
        <div class="controls">
          <button class="btn primary" id="btnStep">Step</button>
          <button class="btn" id="btnRun">Run all</button>
          <button class="btn" id="btnReset">Reset</button>
        </div>
      </div>

      <div class="midbar">
        <span class="bar-label">λ:</span>
        <div class="lam-group" id="lamGroup"></div>
        <span class="bar-label">folds:</span>
        <div class="fold-strip" id="foldStrip"></div>
        <div class="legend">
          <span class="dot" style="background:#3a7ebf"></span>train
          <span class="dot" style="background:#2ecc71"></span>validation
          <span class="line" style="background:#674ea7"></span>ridge fit
        </div>
      </div>

      <div class="plots">
        <div id="plotFit"></div>
        <div id="plotBars"></div>
        <div id="plotAvg"></div>
      </div>
    </div>

    <script>
      // ---------- fixed dataset (listed order = fold order) ----------
      // 9 points, 3 folds of 3. Roughly y = 0.6x plus noise, chosen so that the
      // OLS slope swings from fold to fold and a moderate lambda wins the sweep.
      const DATA_X = [0.34, 0.23, 0.76, 0.50, 0.83, 0.90, 0.37, 0.20, 0.14];
      const DATA_Y = [0.74, 0.56, 1.50, 0.70, 0.99, 0.30, 0.38, 0.53, 0.07];
      const N = 9, K = 3, PER = 3;
      const LAMBDAS = [0, 0.1, 1];
      const LAM_LABELS = ['0', '0.1', '1'];

      const trainCol = '#3a7ebf', valCol = '#2ecc71',
            fitCol = '#674ea7', errCol = '#f1c40f';
      const cfg = { displayModeBar: false, responsive: true };

      // ---------- ridge regression, closed form ----------
      // hypothesis h(x) = θx, no offset, as in lecture
      // J(θ) = (1/n) Σ (θx − y)² + λθ²   →   θ = Σxy / (Σx² + nλ)
      function ridgeFit(xs, ys, lambda) {
        let sxx = 0, sxy = 0;
        for (let i = 0; i < xs.length; i++) { sxx += xs[i] * xs[i]; sxy += xs[i] * ys[i]; }
        return sxy / (sxx + xs.length * lambda);
      }

      function mseOf(theta, xs, ys) {
        return xs.reduce((s, x, i) => s + (theta * x - ys[i]) ** 2, 0) / xs.length;
      }

      function foldIdx(f) {
        const val = [], tr = [];
        for (let i = 0; i < N; i++) (i >= f * PER && i < (f + 1) * PER ? val : tr).push(i);
        return { val, tr };
      }

      // ---------- state ----------
      let li = 0, fi = 0;                 // next (lambda, fold) to run
      let foldE = LAMBDAS.map(() => []);  // per-fold val MSE, per lambda
      let avgE = LAMBDAS.map(() => null); // avg val MSE per lambda
      let last = null;                    // most recently computed fold, for the fit plot
      let runTimer = null;

      const allDone = () => avgE.every(a => a !== null);

      function fmt(e) {
        if (e >= 100) return e.toFixed(0);
        if (e >= 10) return e.toFixed(1);
        if (e >= 1) return e.toFixed(2);
        return e.toFixed(3);
      }

      function step() {
        if (allDone()) { render(); return; }
        const { val, tr } = foldIdx(fi);
        const theta = ridgeFit(tr.map(i => DATA_X[i]), tr.map(i => DATA_Y[i]), LAMBDAS[li]);
        const trainMse = mseOf(theta, tr.map(i => DATA_X[i]), tr.map(i => DATA_Y[i]));
        const valMse = mseOf(theta, val.map(i => DATA_X[i]), val.map(i => DATA_Y[i]));
        foldE[li][fi] = valMse;
        last = { li, fi, theta, trainMse, valMse, val, tr };
        if (fi === K - 1) {
          avgE[li] = foldE[li].reduce((a, b) => a + b, 0) / K;
        }
        // advance: next fold, else next lambda without an average yet (wrap)
        if (fi < K - 1) {
          fi++;
        } else {
          fi = 0;
          for (let s = 1; s <= LAMBDAS.length; s++) {
            const cand = (li + s) % LAMBDAS.length;
            if (avgE[cand] === null) { li = cand; break; }
          }
        }
        render();
      }

      function stopRun() {
        if (runTimer) { clearInterval(runTimer); runTimer = null; }
        document.getElementById('btnRun').textContent = 'Run all';
      }

      function runAll() {
        if (runTimer) { stopRun(); return; }
        if (allDone()) return;
        document.getElementById('btnRun').textContent = 'Pause';
        runTimer = setInterval(() => {
          step();
          if (allDone()) stopRun();
        }, 500);
      }

      function reset() {
        stopRun();
        li = 0; fi = 0;
        foldE = LAMBDAS.map(() => []);
        avgE = LAMBDAS.map(() => null);
        last = null;
        render();
      }

      let jumped = false;

      function jumpTo(j) {
        stopRun();
        li = j; fi = 0;
        foldE[j] = [];
        avgE[j] = null;
        last = null;
        jumped = true;
        render();
        jumped = false;
      }

      // ---------- rendering ----------
      const dispLi = () => (last ? last.li : li);

      function setStatus() {
        const el = document.getElementById('status');
        if (!last) {
          el.textContent = jumped
            ? 'λ = ' + LAM_LABELS[li] + ' selected. Step runs fold 1 of ' + K + '.'
            : 'Each step fits h(x) = θx by ridge on two folds and scores the held-out fold.';
          return;
        }
        let msg = 'λ = ' + LAM_LABELS[last.li] + ', fold ' + (last.fi + 1) + ' of ' + K +
                  '. θ = ' + last.theta.toFixed(2) +
                  ', train MSE ' + fmt(last.trainMse) + ', val MSE ' + fmt(last.valMse) + '.';
        if (last.fi === K - 1) msg += ' Avg val MSE ' + fmt(avgE[last.li]) + '.';
        if (allDone()) {
          const best = avgE.indexOf(Math.min(...avgE));
          msg = 'Sweep complete. λ = ' + LAM_LABELS[best] + ' has the lowest average val error.';
        }
        el.textContent = msg;
      }

      function renderStrip() {
        const strip = document.getElementById('foldStrip');
        for (let f = 0; f < K; f++) {
          const c = strip.children[f];
          c.classList.toggle('val', last !== null && last.fi === f);
          c.classList.toggle('scored', foldE[dispLi()][f] !== undefined);
        }
      }

      function renderLamButtons() {
        document.querySelectorAll('#lamGroup button').forEach((b, j) => {
          b.classList.toggle('active', j === dispLi());
        });
      }

      function drawFit() {
        const traces = [];
        if (last) {
          traces.push({
            x: [0, 1], y: [0, last.theta],
            type: 'scatter', mode: 'lines',
            line: { color: fitCol, width: 2.5 },
            hoverinfo: 'skip',
          });
        }
        const trI = last ? last.tr : Array.from({ length: N }, (_, i) => i);
        traces.push({
          x: trI.map(i => DATA_X[i]), y: trI.map(i => DATA_Y[i]),
          type: 'scatter', mode: 'markers',
          marker: { size: 9, color: trainCol, line: { color: '#fff', width: 1.5 } },
          hovertemplate: '(%{x:.2f}, %{y:.2f})<extra>train</extra>',
        });
        if (last) {
          traces.push({
            x: last.val.map(i => DATA_X[i]), y: last.val.map(i => DATA_Y[i]),
            type: 'scatter', mode: 'markers',
            marker: { size: 12, color: valCol, line: { color: '#fff', width: 1.5 } },
            hovertemplate: '(%{x:.2f}, %{y:.2f})<extra>validation</extra>',
          });
        }
        const title = last
          ? 'ridge fit, λ = ' + LAM_LABELS[last.li] + ', fold ' + (last.fi + 1) + ' held out'
          : 'data, ' + N + ' points';
        Plotly.react('plotFit', traces, {
          title: { text: title, font: { size: 13, color: '#555' }, y: 0.98 },
          xaxis: { title: { text: 'x', font: { size: 13 } }, range: [0, 1], zeroline: false, gridcolor: '#eee' },
          yaxis: { title: { text: 'y', font: { size: 13 } }, range: [-0.2, 1.9], zeroline: false, gridcolor: '#eee' },
          margin: { l: 46, r: 10, t: 30, b: 40 },
          paper_bgcolor: '#fafafa', plot_bgcolor: '#fafafa',
          showlegend: false, hovermode: 'closest',
        }, cfg);
      }

      const FOLD_LABELS = Array.from({ length: K }, (_, f) => 'fold ' + (f + 1));

      function drawBars() {
        const errs = foldE[dispLi()];
        const xs = [], ys = [];
        for (let f = 0; f < K; f++) {
          if (errs[f] !== undefined) { xs.push(FOLD_LABELS[f]); ys.push(errs[f]); }
        }
        const shapes = [], annotations = [];
        if (avgE[dispLi()] !== null) {
          shapes.push({
            type: 'line', xref: 'paper', x0: 0, x1: 1,
            y0: avgE[dispLi()], y1: avgE[dispLi()],
            line: { color: '#333', width: 1.5, dash: 'dash' },
          });
          annotations.push({
            xref: 'paper', x: 0.02, y: avgE[dispLi()],
            text: 'avg ' + fmt(avgE[dispLi()]),
            showarrow: false, yanchor: 'bottom', xanchor: 'left',
            font: { size: 11, color: '#333' },
          });
        }
        // invisible anchor keeps all fold slots on the axis while bars accumulate
        const anchor = {
          x: FOLD_LABELS, y: FOLD_LABELS.map(() => null),
          type: 'scatter', mode: 'markers', hoverinfo: 'skip', showlegend: false,
        };
        Plotly.react('plotBars', [anchor, {
          x: xs, y: ys, type: 'bar',
          marker: { color: errCol },
          hovertemplate: '%{x}<br>val MSE %{y:.3f}<extra></extra>',
        }], {
          title: { text: 'per-fold val MSE, λ = ' + LAM_LABELS[dispLi()], font: { size: 13, color: '#555' }, y: 0.98 },
          xaxis: {
            type: 'category',
            categoryorder: 'array',
            categoryarray: FOLD_LABELS,
            range: [-0.5, K - 0.5],
            tickfont: { size: 11 }, fixedrange: true,
          },
          yaxis: { range: [0, 1.0], zeroline: false, gridcolor: '#eee', tickfont: { size: 11 } },
          margin: { l: 40, r: 10, t: 30, b: 40 },
          paper_bgcolor: '#fafafa', plot_bgcolor: '#fafafa',
          showlegend: false, bargap: 0.35,
          shapes, annotations,
        }, cfg);
      }

      function drawAvg() {
        const xs = [], ys = [];
        for (let j = 0; j < LAMBDAS.length; j++) {
          if (avgE[j] !== null) { xs.push(LAM_LABELS[j]); ys.push(avgE[j]); }
        }
        const traces = [{
          // invisible anchor keeps all λ slots on the axis from the start
          x: LAM_LABELS, y: LAM_LABELS.map(() => null),
          type: 'scatter', mode: 'markers', hoverinfo: 'skip', showlegend: false,
        }, {
          x: xs, y: ys,
          type: 'scatter', mode: 'lines+markers',
          line: { color: '#999', width: 1.5 },
          marker: { size: 10, color: errCol, line: { color: '#fff', width: 1.5 } },
          hovertemplate: 'λ = %{x}<br>avg val MSE %{y:.3f}<extra></extra>',
        }];
        const annotations = [];
        if (allDone()) {
          const best = avgE.indexOf(Math.min(...avgE));
          traces.push({
            x: [LAM_LABELS[best]], y: [avgE[best]],
            type: 'scatter', mode: 'markers',
            marker: { size: 19, color: 'rgba(0,0,0,0)', line: { color: valCol, width: 3 } },
            hoverinfo: 'skip',
          });
          annotations.push({
            x: best, y: avgE[best],
            text: 'lowest avg error',
            showarrow: true, arrowhead: 2, arrowcolor: valCol,
            ax: 0, ay: -32,
            font: { size: 12, color: '#2a9d5c' },
          });
        }
        Plotly.react('plotAvg', traces, {
          title: { text: 'average val MSE per λ', font: { size: 13, color: '#555' }, y: 0.98 },
          xaxis: {
            title: { text: 'λ', font: { size: 13 } },
            type: 'category', categoryorder: 'array', categoryarray: LAM_LABELS,
            range: [-0.5, LAMBDAS.length - 0.5],
            fixedrange: true, tickfont: { size: 11 },
          },
          yaxis: {
            title: { text: 'avg val MSE', font: { size: 13 } },
            range: [0, 0.55],
            zeroline: false, gridcolor: '#eee', tickfont: { size: 11 },
          },
          margin: { l: 52, r: 14, t: 30, b: 40 },
          paper_bgcolor: '#fafafa', plot_bgcolor: '#fafafa',
          showlegend: false, hovermode: 'closest',
          annotations,
        }, cfg);
      }

      function render() {
        setStatus();
        renderStrip();
        renderLamButtons();
        drawFit();
        drawBars();
        drawAvg();
      }

      // ---------- build controls ----------
      const lamGroup = document.getElementById('lamGroup');
      LAM_LABELS.forEach((lab, j) => {
        const b = document.createElement('button');
        b.textContent = lab;
        b.addEventListener('click', () => jumpTo(j));
        lamGroup.appendChild(b);
      });

      const foldStrip = document.getElementById('foldStrip');
      for (let f = 0; f < K; f++) {
        const c = document.createElement('div');
        c.className = 'chunk';
        c.textContent = 'fold ' + (f + 1);
        foldStrip.appendChild(c);
      }

      document.getElementById('btnStep').addEventListener('click', () => { stopRun(); step(); });
      document.getElementById('btnRun').addEventListener('click', runAll);
      document.getElementById('btnReset').addEventListener('click', reset);

      render();

      // ?steps=N pre-runs N steps (handy for screenshots)
      const preSteps = parseInt(new URLSearchParams(window.location.search).get('steps') || '0', 10);
      for (let s = 0; s < preSteps; s++) step();

      window.addEventListener('resize', () => {
        ['plotFit', 'plotBars', 'plotAvg'].forEach(id =>
          Plotly.Plots.resize(document.getElementById(id)));
      });
    </script>
    <div style="position:fixed;bottom:0;width:100%;text-align:center;padding:6px 0;font-size:13px;color:#888;background:#fafafa;">
      <a href="https://github.com/shensquared/demos" target="_blank" style="color:#007bff;text-decoration:none;">Source</a>
      <span style="margin:0 6px;">|</span>
      <a href="https://github.com/shensquared/demos/issues" target="_blank" style="color:#007bff;text-decoration:none;">Report a Bug</a>
    </div>
  </body>
</html>
