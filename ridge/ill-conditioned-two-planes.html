<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One Dataset, Two Planes</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        /* Locked tokens. The mark colours stay as they are, since a mark only has
           to clear 3:1; their text tints are darkened to pass AA as body copy. */
        :root {
            --opt-mark: #3c78d8;   /* mirrored in the JS PLANES object below, for Plotly */
            --flat-mark: #cc3b2f;
            --opt-text: #3372d6;
            --flat-text: #cc3b2f;
            --ink: #2b2b2b;
            --ink-2: #555555;
            --muted: #5f6672;
            --rule: #e2e2e2;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: var(--ink);
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 10px 14px 8px;
            gap: 8px;
        }
        /* Embed mode: the slide supplies the title and the surrounding space, so
           trim the padding the standalone page needs. */
        body.embed .app { padding: 6px 8px 4px; gap: 6px; }

        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .mode-group {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .mode-group button {
            padding: 7px 16px;
            font-size: 15px;
            font-family: inherit;
            border: none;
            background: #fff;
            color: var(--ink-2);
            cursor: pointer;
            transition: background-color .2s ease, color .2s ease;
        }
        .mode-group button:not(:last-child) { border-right: 1px solid #ddd; }
        .mode-group button.active { background: #555; color: #fff; }
        .mode-group button:hover:not(.active) { background: #f2f2f2; }
        .mode-group button:active:not(.active) { background: #e6e6e6; }
        /* The buttons had no focus indicator at all, so keyboard use was invisible. */
        .mode-group button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
        @media (prefers-reduced-motion: reduce) { .mode-group button { transition: none; } }
        .eq {
            flex: 1;
            min-width: 0;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .opt { color: var(--opt-text); }
        .flat { color: var(--flat-text); }
        .katex { font-size: 1.1em; }
        .main {
            flex: 1;
            display: flex;
            gap: 14px;
            min-height: 0;
        }
        /* A fixed width, because the stats change width between the two views, and any
           change here resizes the plot and makes the 3D scene jump. */
        .side {
            flex: none;
            width: 13rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 22px;
            justify-content: center;
        }
        table {
            border-collapse: collapse;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }
        th, td {
            padding: 3px 9px;
            text-align: right;
        }
        th {
            font-weight: 500;
            color: var(--muted);
            border-bottom: 1px solid var(--rule);
        }
        /* The two numbers the toggle is about, so they get the largest type on the page. */
        .stats {
            display: flex;
            gap: 28px;
            margin: 0;
            padding-left: 9px;
        }
        .stats dt { font-size: 14px; color: var(--muted); }
        .stats dd {
            margin: 2px 0 0;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
        }
        #plot { flex: 1; min-width: 0; }
    </style>
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div class="mode-group" id="modeGroup">
                <button data-mode="opt">exact optimum</button>
                <button data-mode="flat">flatter plane</button>
            </div>
            <div class="eq" id="eq"></div>
        </div>
        <div class="main">
            <div class="side">
                <table id="table"></table>
                <dl class="stats" id="stats"></dl>
            </div>
            <div id="plot"></div>
        </div>
    </div>

    <script>
        // Made-up centred data. x2 is x1 plus a ±0.001 wiggle, so the inputs sit almost
        // on the line x2 = x1 and XᵀX is invertible but nearly singular. y = x1 +
        // 1000·(x2 − x1) exactly, so the exact optimum θ = (−999, 1000) passes through
        // every point.
        const D = {
            x1: [-2, -1, 1, 2],
            x2: [-1.999, -1.001, 0.999, 2.001],
            y: [-1, -2, 0, 3],
        };

        // Fit h = θ1·x1 + θ2·x2 by minimising (1/n)·Σ(h − y)² + λ·‖θ‖². The data is
        // centred, so the plane needs no offset: solve the 2×2 system (XᵀX + nλI)θ = Xᵀy.
        // λ = 0 is plain OLS.
        function fitPlane(lam) {
            const n = D.y.length;
            let a = n * lam, b = 0, c = n * lam, r1 = 0, r2 = 0;
            for (let i = 0; i < n; i++) {
                const u = D.x1[i], v = D.x2[i], w = D.y[i];
                a += u * u; b += u * v; c += v * v; r1 += u * w; r2 += v * w;
            }
            const det = a * c - b * b;
            const t1 = (c * r1 - b * r2) / det, t2 = (a * r2 - b * r1) / det;
            const theta = [t1, t2];
            const mse = D.y.reduce((s, y, i) =>
                s + (theta[0] * D.x1[i] + theta[1] * D.x2[i] - y) ** 2, 0) / n;
            return { theta, norm: Math.hypot(t1, t2), mse };
        }

        // The exact optimum is the OLS fit. The flatter plane is the ridge fit at
        // λ = 0.1, which gives up a little training error for a far smaller θ.
        const PLANES = {
            opt: { ...fitPlane(0), color: '#3c78d8', light: '#c9daf8' },
            flat: { ...fitPlane(0.1), color: '#cc3b2f', light: '#f4c7c3' },
        };

        // Plane patch over the data box. The exact optimum is close to vertical, so the
        // fixed z-range below keeps it from dragging the scene out of shape, and keeps
        // the axes still when the view toggles.
        const X1 = [-2.5, 2.5], X2 = [-2.5, 2.5], ZR = [-750, 750];
        function planeTrace(key) {
            const p = PLANES[key], th = p.theta;
            const gx = [], gy = [], gz = [];
            const G = 24;
            for (let i = 0; i <= G; i++) gx.push(X1[0] + i * (X1[1] - X1[0]) / G);
            for (let j = 0; j <= G; j++) gy.push(X2[0] + j * (X2[1] - X2[0]) / G);
            for (let j = 0; j <= G; j++) {
                const row = [];
                for (let i = 0; i <= G; i++) row.push(th[0] * gx[i] + th[1] * gy[j]);
                gz.push(row);
            }
            return {
                type: 'surface', x: gx, y: gy, z: gz,
                colorscale: [[0, p.light], [1, p.color]],
                opacity: 0.55, showscale: false, hoverinfo: 'skip',
            };
        }
        const pointsTrace = {
            type: 'scatter3d', mode: 'markers',
            x: D.x1, y: D.x2, z: D.y,
            marker: { size: 7, color: '#3c78d8', line: { color: '#fff', width: 1.5 } },
            hovertemplate: '(%{x}, %{y}) → %{z}<extra></extra>',
        };

        // Plotly's <sub> tags render real subscripts in 3D scenes; Unicode ₁ ₂ come out
        // as specks. Ticks use the page's sans so they match the table.
        const axisStyle = {
            titlefont: { size: 16, color: '#2b2b2b' },
            tickfont: { size: 13, color: '#5f6672' },  // 13px at 5.8:1; the old 11px #999 measured 2.9:1
            nticks: 5,
            gridcolor: '#dcdcdc',
        };
        const layout = {
            font: { family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
            scene: {
                xaxis: { title: 'x<sub>1</sub>', range: X1, ...axisStyle },
                yaxis: { title: 'x<sub>2</sub>', range: X2, ...axisStyle },
                zaxis: { title: 'y', range: ZR, ...axisStyle },
                camera: { eye: { x: 1.85, y: 1.4, z: 0.64 } },
                aspectmode: 'manual',
                aspectratio: { x: 1.4, y: 1.4, z: 1 },
            },
            margin: { l: 0, r: 0, t: 0, b: 0 },
            showlegend: false,
            paper_bgcolor: '#fafafa',
            // Keeps a camera the viewer has dragged when the toggle redraws the plot.
            uirevision: 'keep',
        };

        let html = `<tr><th>x<sub>1</sub></th><th>x<sub>2</sub></th><th>y</th></tr>`;
        for (let i = 0; i < D.y.length; i++) html += `<tr><td>${D.x1[i]}</td><td>${D.x2[i]}</td><td>${D.y[i]}</td></tr>`;
        document.getElementById('table').innerHTML = html;

        let mode = 'opt';
        function render() {
            const p = PLANES[mode], th = p.theta;
            Plotly.react('plot', [planeTrace(mode), pointsTrace], layout, { responsive: true, displayModeBar: false });

            document.querySelectorAll('#modeGroup button').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === mode);
                b.setAttribute('aria-pressed', b.dataset.mode === mode);
            });
            const s = v => (v < 0 ? '- ' : '+ ') + Math.abs(v).toFixed(3);
            const eq = document.getElementById('eq');
            eq.className = 'eq ' + mode;
            eq.innerHTML = katex.renderToString(String.raw`h = ${th[0].toFixed(3)}\,x_1 ${s(th[1])}\,x_2`);
            // Whole numbers stay whole (1414, not 1.41e+3), and the exact fit's
            // rounding-level MSE reads as 0.
            const f = v => v < 1e-9 ? '0' : v >= 100 ? v.toFixed(0) : v.toPrecision(3);
            document.getElementById('stats').innerHTML =
                `<div><dt>${katex.renderToString(String.raw`\|\theta\|`)}</dt><dd>${f(p.norm)}</dd></div>` +
                `<div><dt>MSE</dt><dd>${f(p.mse)}</dd></div>`;
        }

        document.querySelectorAll('#modeGroup button').forEach(b =>
            b.addEventListener('click', () => { mode = b.dataset.mode; render(); }));

        const params = new URLSearchParams(window.location.search);
        if (params.has('embed')) document.body.classList.add('embed');
        if (params.get('mode') in PLANES) mode = params.get('mode');

        render();
        // A window listener misses the reflow that matters here: the KaTeX fonts land
        // after the plot is drawn and change the height of the equation row, which
        // resizes the plot's box without the window ever changing.
        const plotEl = document.getElementById('plot');
        if (window.ResizeObserver) {
            new ResizeObserver(() => Plotly.Plots.resize(plotEl)).observe(plotEl);
        } else {
            window.addEventListener('resize', () => Plotly.Plots.resize(plotEl));
        }
    </script>
</body>
</html>
