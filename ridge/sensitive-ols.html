<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OLS Is Sensitive: Two Planes, One Tiny Perturbation</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        /* The same locked colours ill-conditioned-two-planes.html uses, so the two
           slides look like one pair. Mark colours are mirrored in the JS below,
           since Plotly cannot read custom properties. */
        :root {
            --a-mark: #cc3b2f;
            --b-mark: #3c78d8;
            --a-text: #cc3b2f;
            --b-text: #3372d6;
            --ink: #2b2b2b;
            --ink-2: #555555;
            --muted: #5f6672;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: var(--ink);
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px 16px 10px;
            gap: 8px;
        }
        /* Embed mode: the slide supplies the title and the surrounding space. */
        body.embed .app { padding: 6px 8px 4px; gap: 6px; }

        .eqs {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 28px;
            font-size: 17px;
        }
        .eqs .a { color: var(--a-text); }
        .eqs .b { color: var(--b-text); }
        .note { color: var(--muted); font-size: 14px; }
        .katex { font-size: 1.1em; }

        #plot { flex: 1 1 0; min-height: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div class="app">
        <div class="eqs">
            <span class="a" id="eqA"></span>
            <span class="b" id="eqB"></span>
        </div>
        <div id="plot"></div>
    </div>

    <script>
        if (new URLSearchParams(window.location.search).has('embed')) {
            document.body.classList.add('embed');
        }

        // HW1 Worcester-temperature data: x1 = Cambridge, x2 = Boston, y = Worcester (°F).
        // A is the rounded readings; B is the precise readings, a perturbation of A the
        // size of measurement noise. This page shows A and B at once.
        const DATA = {
            a: { x1: [78, 79, 81, 82], x2: [76, 78, 82, 84], y: [78, 77, 80, 83],
                 color: '#cc3b2f', light: '#f4c7c3', label: 'A' },
            b: { x1: [78.001, 78.998, 81.002, 82.002], x2: [75.994, 77.997, 82.009, 84.006], y: [78, 77, 80, 83],
                 color: '#3c78d8', light: '#c9daf8', label: 'B' },
        };

        // OLS with offset, the way HW1's sklearn fit does it: centre x and y, solve the
        // 2x2 normal equations by pseudo-inverse, recover the offset from the means.
        // Dataset A is exactly collinear once the offset column is in (x2 = 2*x1 - 80 on
        // every row), so its plane is one of infinitely many; the pseudo-inverse returns
        // the minimum-norm one, which is what HW1 showed.
        function fitPlane(d) {
            const n = d.y.length;
            const mean = v => v.reduce((s, x) => s + x, 0) / n;
            const m1 = mean(d.x1), m2 = mean(d.x2), my = mean(d.y);
            let a = 0, b = 0, c = 0, r1 = 0, r2 = 0;
            for (let i = 0; i < n; i++) {
                const u = d.x1[i] - m1, v = d.x2[i] - m2, w = d.y[i] - my;
                a += u * u; b += u * v; c += v * v; r1 += u * w; r2 += v * w;
            }
            const tr = a + c, det = a * c - b * b, disc = Math.sqrt(Math.max(tr * tr / 4 - det, 0));
            const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
            const e1 = Math.abs(b) > 1e-12 ? [l1 - c, b] : (a >= c ? [1, 0] : [0, 1]);
            const n1 = Math.hypot(e1[0], e1[1]); e1[0] /= n1; e1[1] /= n1;
            const e2 = [-e1[1], e1[0]];
            const tol = 1e-10 * l1;
            let t1 = 0, t2 = 0;
            for (const [lam, e] of [[l1, e1], [l2, e2]]) {
                if (lam <= tol) continue;
                const p = (e[0] * r1 + e[1] * r2) / lam;
                t1 += p * e[0]; t2 += p * e[1];
            }
            return { theta: [t1, t2, my - t1 * m1 - t2 * m2], singular: l2 <= tol };
        }
        const FIT = { a: fitPlane(DATA.a), b: fitPlane(DATA.b) };
        const THETA = { a: FIT.a.theta, b: FIT.b.theta };

        // Plane patch over the data box. B's plane is close to vertical, so the fixed
        // z-range below is what keeps it from dragging the whole scene out of shape.
        const X1 = [77.5, 82.5], X2 = [75.5, 84.5], ZR = [-300, 450];
        function planeTrace(key) {
            const th = THETA[key], d = DATA[key];
            const gx = [], gy = [], gz = [];
            const G = 24;
            for (let i = 0; i <= G; i++) gx.push(X1[0] + i * (X1[1] - X1[0]) / G);
            for (let j = 0; j <= G; j++) gy.push(X2[0] + j * (X2[1] - X2[0]) / G);
            for (let j = 0; j <= G; j++) {
                const row = [];
                for (let i = 0; i <= G; i++) row.push(th[0] * gx[i] + th[1] * gy[j] + th[2]);
                gz.push(row);
            }
            return {
                type: 'surface', x: gx, y: gy, z: gz,
                colorscale: [[0, d.light], [1, d.color]],
                opacity: 0.55, showscale: false, hoverinfo: 'skip',
            };
        }
        function pointsTrace(key) {
            const d = DATA[key];
            return {
                type: 'scatter3d', mode: 'markers',
                x: d.x1, y: d.x2, z: d.y,
                marker: { size: 7, color: d.color, line: { color: '#fff', width: 1.5 } },
                hoverinfo: 'skip',
            };
        }

        // Plotly's <sub> tags render real subscripts in 3D scenes; Unicode subscripts
        // come out as specks.
        const axisStyle = {
            titlefont: { size: 16, color: '#2b2b2b' },
            tickfont: { size: 13, color: '#5f6672' },
            nticks: 5,
            gridcolor: '#dcdcdc',
        };
        const layout = {
            font: { family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
            scene: {
                xaxis: { title: 'Cambridge (x<sub>1</sub>)', range: X1, ...axisStyle },
                yaxis: { title: 'Boston (x<sub>2</sub>)', range: X2, ...axisStyle },
                zaxis: { title: 'Worcester (y)', range: ZR, ...axisStyle },
                camera: { eye: { x: 1.48, y: 1.12, z: 0.51 } },
                aspectmode: 'manual',
                aspectratio: { x: 1.4, y: 1.4, z: 1 },
            },
            // A margin all round rather than zero: at zero the axis titles sit on the
            // div edge and the last one clips.
            margin: { l: 8, r: 8, t: 8, b: 8 },
            showlegend: false,
            paper_bgcolor: '#fafafa',
        };

        function fmtEq(key) {
            const th = THETA[key], d = DATA[key];
            const s = v => (v < 0 ? '- ' : '+ ') + Math.abs(v).toFixed(3);
            let eq = 'dataset ' + d.label + '&nbsp; ' +
                katex.renderToString(String.raw`h = ${th[0].toFixed(3)}\,x_1 ${s(th[1])}\,x_2 ${s(th[2])}`);
            if (FIT[key].singular) {
                eq += ` <span class="note">(${katex.renderToString('X^TX')} singular; min-norm plane, as in HW1)</span>`;
            }
            return eq;
        }

        document.getElementById('eqA').innerHTML = fmtEq('a');
        document.getElementById('eqB').innerHTML = fmtEq('b');

        Plotly.newPlot('plot',
            [planeTrace('a'), planeTrace('b'), pointsTrace('a'), pointsTrace('b')],
            layout, { responsive: true, displayModeBar: false });

        // The KaTeX fonts land after the plot is drawn and change the height of the
        // equation rows, which resizes the plot's box without the window ever changing.
        const plotEl = document.getElementById('plot');
        if (window.ResizeObserver) {
            new ResizeObserver(() => Plotly.Plots.resize(plotEl)).observe(plotEl);
        } else {
            window.addEventListener('resize', () => Plotly.Plots.resize(plotEl));
        }
    </script>
</body>
</html>
